@media(min-width:640px){#app{margin:28px auto;border:5px solid #fff;border-radius:31px;min-height:900px}#bottomNav{border-radius:0 0 24px 24px}}
.top-line{height:3px;background:linear-gradient(90deg,#332b28 0 55%,#ac6c62 55% 78%,#cfad92 78%)}
.demo-flag{font-size:9px;background:#eae3db;color:#6f625a;text-align:left;letter-spacing:.055em;padding:7px 22px;font-weight:700}
.header{height:74px;max-width:100%;padding:12px 22px 11px;background:var(--bg);border-bottom:1px solid #e9e1d9;z-index:5}
.brand{gap:11px}.brand-logo{background:#332a29;border:0;border-radius:11px;color:#fff8f1;font:bold 15px Georgia,serif;letter-spacing:-.09em;width:40px;height:40px;box-shadow:0 5px 12px #36231c16}.brand small{font-size:8px;color:#9d897e;letter-spacing:.22em;font-weight:800}.brand b{font-size:20px;color:#302925;letter-spacing:-.035em;font-weight:500}.brand b span{color:#b97670!important;font-size:12px!important}
.header-action{width:41px;height:41px;background:#fffefa;border-radius:50%;border-color:#e8dfd9;box-shadow:none;color:#51463e}.header-action .dot{background:#bc695d}
main{padding:14px 22px calc(142px + env(safe-area-inset-bottom));min-height:calc(100dvh - 150px)}
.page-head{margin:12px 0 19px}.eyebrow{font-size:9px;letter-spacing:.19em;color:#a27467;font-weight:800;margin-bottom:8px}.page-title{font:500 clamp(31px,9vw,38px)/1.08 Georgia,'Times New Roman',serif;letter-spacing:-.045em;color:#2b2925;margin:0 0 8px}.page-desc{color:#8b7d74;font-size:12.5px;line-height:1.5;margin:0}
.hero{min-height:236px;border-radius:23px;background:radial-gradient(ellipse at 105% -20%,#836357 0,transparent 48%),linear-gradient(145deg,#3c302d,#262522 85%);border:1px solid #54423b;box-shadow:0 16px 25px rgba(52,32,27,.13);padding:24px 20px 24px;color:#fff;position:relative;overflow:hidden}
.hero:before{content:'';position:absolute;width:250px;height:250px;border:1px solid rgba(246,213,192,.20);border-radius:50%;left:auto;right:-128px;top:45px;transform:none}.hero:after{content:'';position:absolute;width:160px;height:160px;border:1px solid rgba(246,213,192,.16);border-radius:50%;right:-65px;top:89px;left:auto;transform:none;opacity:1}
.hero-kicker{font-size:10px;letter-spacing:.15em;color:#d9bdac;position:relative;z-index:2;font-weight:650}.hero-dot{background:#dfad95;width:5px;height:5px}.hero-content{z-index:2;position:relative;max-width:100%}.hero-caption{color:#e4d6cd;font-size:12px;margin-top:28px}.hero-amount{font:500 clamp(28px,7.5vw,35px)/1.1 Georgia,serif;color:#fff8ee;letter-spacing:-.04em;margin-top:7px;white-space:nowrap;position:relative;z-index:4}
.hero-trend{display:inline-flex;align-items:center;gap:7px;background:rgba(255,255,255,.12);border:1px solid #ffffff26;color:#ead0c2;padding:8px 11px;border-radius:40px;font-size:10.5px;margin-top:24px;position:relative;z-index:5}.hero-trend svg{width:13px;height:13px}
.hero-photo{top:17px;right:19px;width:66px;transform:none;padding:3px;border:1px solid #ffffff5b;border-radius:50%;background:#fff6ec;box-shadow:0 4px 15px #0002;z-index:3}.hero-photo img{border-radius:50%;height:57px;object-position:center 21%;width:100%}.hero-photo small{display:none}
.summary-top{margin:24px 1px 12px;align-items:center}.section-title{font-size:15px;color:#332f29;font-weight:750;letter-spacing:-.015em}.subtle-btn{font-size:11px;color:#a2665b}
.kpi-grid{gap:10px}.kpi{min-height:117px;padding:15px 14px 12px;background:#fffefa;border:1px solid #e9e3dc;border-radius:17px;box-shadow:none}.kpi.rose,.kpi.sage,.kpi.sand{background:#fffefa;border-color:#e9e3dc}.kpi .kpi-label{font-size:11px;color:#80756f;line-height:1.3;font-weight:600;padding-right:23px}.kpi .kpi-value{font-family:-apple-system,BlinkMacSystemFont,'Avenir Next',sans-serif;font-size:27px;line-height:1.13;margin-top:13px;font-weight:760;color:#312c27;letter-spacing:-.045em}.kpi .kpi-value.small{font-size:20px;letter-spacing:-.04em}.kpi .kpi-note{font-size:10px;color:#a3988c;margin-top:8px}.kpi .kpi-note.emphasis{color:#9f655b;font-weight:750;font-size:10px}.kpi .kpi-icon{width:27px;height:27px;background:#f4f0e9;top:12px;right:11px;border-radius:9px;color:#87665a}.kpi.rose .kpi-icon{color:#87544c}.kpi.sage .kpi-icon{color:#537c65}
.insight{width:100%;margin-top:13px;background:#f0e2d8;border:1px solid #ead4c6;border-radius:16px;box-shadow:none;padding:13px 14px;gap:10px}.insight .icon-bubble{width:35px;height:35px;background:#fff7f1;color:#965f5a;border-radius:11px}.insight b{color:#5b443e;font-size:11px}.insight p{font-size:10px;color:#987e72;margin-top:4px}.insight >svg{color:#896d60;width:17px}
.panel{border-radius:18px;background:#fffefa;border:1px solid #e9e3dc;box-shadow:none;padding:16px}.panel-title{font-size:13px;font-weight:750}.chart{margin-top:15px}.chart-summary{font-size:10px;margin:2px 0 18px;color:#9a8e85}.bars-wrap{height:146px}.chart-grid>span{background:#eee8e1}.chart-axis{color:#afa49a}.bar{max-width:23px;border-radius:5px 5px 1px 1px;background:linear-gradient(180deg,#bea99b,#d2c3b9);box-shadow:none}.bar.active{background:linear-gradient(180deg,#a46059,#d9a198);outline:0}.bar-cell small{color:#9c8c81;font-weight:500}.chart-detail{border:1px solid #eee7e0;background:#f8f5f1;color:#7e6f66;padding:10px 13px}.chart-detail strong{color:#6d453e}
.quick-row{gap:9px}.quick{border:1px solid #e9e3dc;background:#fffefa;border-radius:14px;font-size:10px;padding:13px 4px 10px;box-shadow:none;min-height:83px;color:#55483f}.quick i{width:34px;height:34px;border-radius:11px;background:#f4ece4;color:#9e655d}.quick svg{color:#9e655d}.quick.primary{background:#332b27;color:white;border-color:#332b27}.quick.primary i{background:#ffffff1e;color:white}.quick.primary svg{color:white}
.section-footer{margin-top:15px;color:#a79b91;font-size:10px;line-height:1.5}
#bottomNav{width:min(100%,440px);bottom:0;padding:9px 13px calc(14px + env(safe-area-inset-bottom));border-top:1px solid #e7ded6;background:#fffcf9f8;box-shadow:0 -5px 23px #30231b0c;gap:4px;grid-template-columns:repeat(4,1fr)}.nav-item{font-size:10px;gap:4px;padding:11px 2px 8px;color:#93847b;border-radius:12px;font-weight:650}.nav-item svg{width:20px;height:20px}.nav-item.active{background:#332b27;color:#fff9f2}.nav-item.active svg{stroke:#fff8f0}
.search-box{height:49px;border-radius:13px;background:#fffefa;box-shadow:none;border:1px solid #e8ded7}.search-box input{font-size:12px;color:#3a312e}.search-box svg{color:#96827b}.page-tools{margin-bottom:22px}.icon-button{border-color:#e7ded7;background:#fffefa;border-radius:12px}
.filter-chips{flex-wrap:nowrap;overflow-x:auto;margin:13px -22px 18px;padding:1px 22px 7px;scrollbar-width:none}.filter-chips::-webkit-scrollbar{display:none}.chip{border:1px solid #e6ded8;border-radius:40px;background:#fffefa;font-size:11px;color:#6e6059;font-weight:650;padding:10px 13px}.chip.active{background:#342c29;color:#fff9f3;border-color:#342c29;box-shadow:none}.list-head{margin:0 0 12px}.list-head b{font-size:12px;color:#61544b}.list-head select{background-color:#fffefa;font-size:10px;border-radius:10px}
.order-card{border-radius:16px;border:1px solid #eae4de;background:#fffefa;padding:15px;margin-bottom:10px;box-shadow:none}.order-top{gap:11px;align-items:center}.order-art{width:43px;height:43px;flex:none;border-radius:12px;background:#f2e5dd;color:#8f5e55}.order-person b{font-size:12px;color:#332e2b;line-height:1.1}.order-person small{font-size:10px;color:#aa9c93}.order-price{font-size:13px;font-weight:780;color:#47342f}.order-info{border-top:1px solid #f0e9e2;padding-top:11px;margin-top:11px;gap:5px}.order-item{font-size:11px;max-width:48%;color:#756962}.order-pay{font-size:10px;color:#aa9991}.status{font-size:9px;padding:5px 7px}.status.delivered{background:#e7f0e8;color:#557761}.status.cancelled{background:#f8e6e3;color:#a86662}
.form-card{border:1px solid #e8dfd8;border-radius:20px;background:#fffefa;box-shadow:none;padding:17px 16px 20px}.field span.field-label{font-size:11px;color:#4f423a;font-weight:750}.field input,.field select,.field textarea{background:#faf8f5;border:1px solid #e8e0d8;border-radius:11px;color:#433930;font-size:13px;min-height:49px}.field input:focus,.field select:focus,.field textarea:focus{border-color:#a76c60;box-shadow:0 0 0 3px #d9ada62e}.field input::placeholder,.field textarea::placeholder{color:#b0a49a}.mini-notice{background:#f3f1eb;color:#7b7063;border-radius:13px;border:1px solid #e7e5dc;font-size:10px}.primary-btn{background:#322a27;color:#fff;border:0;border-radius:12px;box-shadow:none;font-weight:750;font-size:12px}.primary-btn:hover{background:#4b3835}.secondary-btn{border-radius:12px;background:#f5eee9}
.profile{background:linear-gradient(145deg,#3b302c,#594039);border:1px solid #5b463e;border-radius:18px;color:white;box-shadow:none;min-height:118px}.profile h3{color:#fff8f2;font-size:19px}.profile p{color:#e1c9bb}.profile .role{background:#ffffff20;border:1px solid #ffffff36;color:#f9e5d7}.profile .pic{border:2px solid #f5e4da;width:70px;height:70px}.setting-group{border:1px solid #e8e0da;border-radius:17px;background:#fffefa;overflow:hidden}.setting{background:#fffefa;padding:14px 13px;min-height:69px}.setting+.setting{border-top:1px solid #ede5df}.setting-icon{border-radius:11px;background:#f5ede7;color:#9c695e}.setting-info strong{color:#3b322e;font-size:12px}.setting-info small{color:#998d84}.switch.on{background:#68483d}.about{color:#ac9a8d;font-size:10px;margin:24px 4px}
.mascot-launcher{right:max(19px,calc((100vw - 440px)/2 + 17px));bottom:calc(87px + env(safe-area-inset-bottom));filter:drop-shadow(0 3px 7px #4c362c20);background:#fffaf5;border:1px solid #e8d9d1;border-radius:50%;width:54px;height:54px;padding:3px;display:flex;justify-content:center;align-items:center}.mascot-launcher img{height:47px;width:47px;border:0;margin:0;object-fit:cover;object-position:center}.mascot-bubble{display:none}
.sheet{max-height:88%;background:#f9f6f2;border-radius:24px 24px 0 0}.sheet-header h3{color:#3d322e}.chat-intro{background:#efe6df}.message.user{background:#e8d3c9;border-color:#e8d3c9}.toast{background:#342b28;color:white;border-radius:15px}
@media(max-width:370px){main{padding-left:17px;padding-right:17px}.header{padding-inline:17px}.hero-amount{font-size:27px}.kpi{padding:13px 11px}.kpi .kpi-value.small{font-size:18px}.filter-chips{margin-inline:-17px;padding-inline:17px}.page-title{font-size:32px}}

</style>

function ask(q){q=q.trim();if(!q)return;const norm=q.normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();const s=stat();let ans='Bản demo này mới hỗ trợ hỏi về tổng đơn, doanh thu, hoa hồng, đơn chưa giao và tên khách. Khi triển khai thật sẽ giữ Em Kem AI hiện tại.';if(norm.includes('hoa hong'))ans=`Tổng hoa hồng đã nhận: ${vnd(s.received)}.

 if(a==='toggle-kem'){state.showKem=!state.showKem;persist();render();toast(state.showKem?'Đã hiện Em Kem':'Đã ẩn Em Kem');return}

 if(a==='reset'){if(confirm('Khôi phục dữ liệu demo ban đầu? Không ảnh hưởng web thật.')){state.orders=seedOrders();state.q='';state.filter='all';persist();render();toast('Đã đặt lại 83 đơn mẫu')}return}
 if(a==='security'){toast('Đây là file HTML độc lập. Không dùng tài khoản hoặc Supabase thật.');return}
 if(a==='export'){exportCSV();return}
});
$('app').addEventListener('input',e=>{if(e.target.id==='searchOrders'){state.q=e.target.value;const list=$('ordersList');if(list)list.innerHTML=orderList();if($('orderCount'))$('orderCount').textContent=activeOrders().length+' đơn hàng';}});
$('app').addEventListener('change',e=>{if(e.target.id==='orderSort'){state.sort=e.target.value;render()}});
$('app').addEventListener('submit',event=>{if(event.target.id==='chatForm'){event.preventDefault();ask(new FormData(event.target).get('question')||'');return}if(event.target.id!=='orderForm')return;event.preventDefault();const f=new FormData(event.target),name=String(f.get('name')||'').trim(),item=String(f.get('item')||'').trim(),price=Number(f.get('price')),commission=Number(f.get('commission')||0);if(!name||!item||!Number.isSafeInteger(price)||!Number.isSafeInteger(commission)||price<0||commission<0){toast('Kiểm tra thông tin và số tiền');return}const o=state.editing?state.orders.find(x=>x.id===state.editing):null;if(o){Object.assign(o,{name,item,price,commission,pay:f.get('pay'),del:f.get('del'),note:String(f.get('note')||'')});toast('Đã lưu thay đổi của đơn demo')}else{let id='DEMO'+String(Date.now()).slice(-8);while(state.orders.some(o=>o.id===id))id+='1';state.orders.unshift({id,name,item,price,commission,pay:f.get('pay'),del:f.get('del'),note:String(f.get('note')||''),created:'2026-11-08T22:44:00+07:00'});toast('Đã thêm đơn mẫu thành công')}state.editing=null;persist();go('orders')});
$('overlay').addEventListener('click',e=>{if(e.target===$('overlay'))closeSheet()});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet()});
render();
