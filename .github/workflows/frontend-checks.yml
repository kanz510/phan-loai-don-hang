name: Frontend checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/frontend.mjs
      - run: |
          for file in app*.js shared-cloud.js order-assistant.js login-assistant.js; do
            node --check "$file" || exit 1
          done
