<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Phân loại đơn hàng</title>
<style>
body{font-family:system-ui,Arial,sans-serif;margin:0;background:#f6f3ee;color:#222}
header{background:#fff;padding:16px 20px;border-bottom:1px solid #e5ddd2;position:sticky;top:0}
h1{margin:0 0 4px;font-size:22px} p{margin:4px 0;color:#666}
main{max-width:1000px;margin:0 auto;padding:16px}
.cards{display:flex;gap:12px;flex-wrap:wrap;margin:12px 0}
.card{background:#fff;border:1px solid #e5ddd2;border-radius:12px;padding:12px 16px;flex:1;min-width:150px}
.card b{font-size:20px;display:block}
.controls{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
input,select,button{padding:9px 11px;border-radius:8px;border:1px solid #ccc;font-size:15px}
button{background:#222;color:#fff;border-color:#222;cursor:pointer}
button.secondary{background:#fff;color:#222}
table{width:100%;border-collapse:collapse;background:#fff;border-radius:12px;overflow:hidden}
th,td{padding:10px;border-bottom:1px solid #eee;text-align:left;vertical-align:top}
th{background:#faf7f2}
.tag{display:inline-block;padding:2px 8px;border-radius:999px;background:#eee;font-size:13px}
form{background:#fff;border:1px solid #e5ddd2;border-radius:12px;padding:14px;display:grid;gap:8px;margin:12px 0}
form .row{display:flex;gap:8px;flex-wrap:wrap} form .row>*{flex:1;min-width:160px}
.note{color:#666;font-size:14px}
</style>
</head>
<body>
<header>
<h1>Phân loại đơn hàng</h1>
<p>Thêm, sửa, xóa đơn và lưu lại trên trình duyệt này (localStorage). Lọc theo trạng thái, tìm theo tên hoặc món hàng.</p>
</header>
<main>
<div class="cards" id="stats"></div>
<div class="controls">
<input id="q" placeholder="Tìm tên khách hoặc món hàng…" oninput="render()">
<select id="filter" onchange="render()">
<option value="all">Tất cả trạng thái</option>
<option value="Chưa rõ">Chưa rõ</option>
<option value="ĐÃ TÍNH">ĐÃ TÍNH</option>
<option value="Đã ck">Đã ck</option>
<option value="Hàng về ship">Hàng về ship</option>
<option value="Hàng về ghé lấy">Hàng về ghé lấy</option>
<option value="Ship tỉnh đã ck">Ship tỉnh đã ck</option>
</select>
<button class="secondary" onclick="exportCSV()">Xuất CSV</button>
<button class="secondary" onclick="resetData()">Khôi phục 31 đơn gốc</button>
</div>
<form onsubmit="saveOrder(event)">
<h3 style="margin:0" id="formTitle">Thêm đơn mới</h3>
<div class="row">
<input id="fName" placeholder="Tên khách *" required>
<input id="fItem" placeholder="Món hàng *" required>
<input id="fPrice" type="number" min="0" placeholder="Giá (nghìn đồng) *" required>
</div>
<div class="row">
<select id="fStatus">
<option>Chưa rõ</option><option>ĐÃ TÍNH</option><option>Đã ck</option>
<option>Hàng về ship</option><option>Hàng về ghé lấy</option><option>Ship tỉnh đã ck</option>
</select>
<input id="fNote" placeholder="Ghi chú (tặng mask, túi về ship…)">
</div>
<button type="submit">Lưu đơn</button>
<p class="note" id="editNote"></p>
</form>
<table>
<thead><tr><th>Khách</th><th>Món hàng</th><th>Giá</th><th>Trạng thái</th><th>Ghi chú</th><th></th></tr></thead>
<tbody id="rows"></tbody>
</table>
<p class="note">Tổng tiền hiển thị theo bộ lọc đang chọn. Giá nhập theo nghìn đồng, ví dụ 340 = 340.000đ.</p>
</main>
<script>
const KEY='phan-loai-don-hang-v1';
const SEED=[
["Thu Nguyệt","Set Phấn Má Hồng PKT + Cọ SPR 47",1480,"Chưa rõ",""],
["Thảo Nhi","Set kem dưỡng tay Jmella",89,"Chưa rõ",""],
["Diễm Phương","Nước hoa Ck 10ml",100,"Chưa rõ",""],
["Chị Duyên","Mcr clio - kcn Dbla hồng",605,"Chưa rõ",""],
["Thanh Nhàn","Bắt sáng sư tử - bảng mắt moon eyes",280,"ĐÃ TÍNH",""],
["Xuân Mai Ny","Kem Dưỡng Arecica - Kem chống nắng",670,"Chưa rõ",""],
["Hoa tu líp","Phấn phủ artmiss - Bông mút lẻ Amt",175,"Chưa rõ",""],
["Phương Vũ","Set son dưỡng Sum",380,"Chưa rõ",""],
["Ni","Son Dior 009",340,"Chưa rõ","Tặng 1 mask PDRN"],
["Phương Vũ","Kem ckđ Tfit - Kích mí lưới",254,"Chưa rõ","Tặng kèm mask PDRN"],
["Mai Bình Minh","Son Dior 009 fullbox + túi hãng",550,"Chưa rõ",""],
["Tố Nhii","Son Dior 009 fullbox + túi hãng",590,"Chưa rõ",""],
["Thanh Tiên","Gương kỳ lân hồng",260,"Chưa rõ",""],
["Phan Gia Huyền","Son Dior 009 unbox",340,"ĐÃ TÍNH",""],
["Mỹ Hiền","Son Dior 029 unbox - Nước hoa CK 10ml",440,"Chưa rõ",""],
["Ngọc Quỳnh","Son Dior 029 unbox",340,"Chưa rõ",""],
["Phan Gia Huyền","Má hồng kem AZTK jc04",135,"Chưa rõ",""],
["Khuê Miên","Son Dior 018 unbox",340,"Chưa rõ",""],
["Lê phan phương dung","Son Dior 037 unbox",340,"Chưa rõ",""],
["Lưu Phương Nhi","Son Dior 009 unbox",340,"Chưa rõ",""],
["Trương Thị Hà My","Son Dior 024 fullbox + túi hãng",590,"Ship tỉnh đã ck","Tặng mask PR"],
["Mỹ Vân","Son Dior 029 unbox",340,"Đã ck",""],
["Minh Hoàng","Son Dior 009 unbox",340,"Chưa rõ",""],
["Cxq Cassie","Son Dior 009 fullbox + túi hãng",590,"Ship tỉnh đã ck",""],
["Hà Khánh","Son Dior 029 unbox",340,"Hàng về ship",""],
["Linh Cẩm","Son Dior 024 unbox",340,"Hàng về ship",""],
["Thảo Nguyễn","Son Dior 038 fullbox + túi hãng",590,"Đã ck","Túi về ship"],
["Thư Lê","Son Dior 009 unbox",340,"Hàng về ship","Mai hàng về ship"],
["Hồng Anh Phan","Son Dior 029 unbox",340,"Đã ck","Hàng về ship tỉnh"],
["Ngọc Quỳnh","Son Dior 018 unbox",340,"Hàng về ghé lấy",""],
["Kim Thi","Son Dior 009 unbox - Serum Nia Ohoh xanh đen",960,"Chưa rõ",""],
];
let orders, editId=null;
try{orders=JSON.parse(localStorage.getItem(KEY))||null}catch(e){orders=null}
if(!orders||!orders.length){orders=SEED.map((r,i)=>({id:i+1,name:r[0],item:r[1],price:r[2],status:r[3],note:r[4]}));persist()}
function persist(){localStorage.setItem(KEY,JSON.stringify(orders))}
function fmt(n){return n.toLocaleString('vi-VN')+'k'}
function render(){
 const q=(document.getElementById('q').value||'').toLowerCase();
 const f=document.getElementById('filter').value;
 const list=orders.filter(o=>(f==='all'||o.status===f)&&((o.name+' '+o.item).toLowerCase().includes(q)));
 const total=list.reduce((s,o)=>s+Number(o.price||0),0);
 document.getElementById('stats').innerHTML=
 `<div class="card"><span>Đơn đang hiển thị</span><b>${list.length}</b></div>
  <div class="card"><span>Tổng tiền đang hiển thị</span><b>${fmt(total)}</b></div>
  <div class="card"><span>Tất cả đơn</span><b>${orders.length} đơn · ${fmt(orders.reduce((s,o)=>s+Number(o.price||0),0))}</b></div>`;
 document.getElementById('rows').innerHTML=list.map(o=>`<tr>
  <td>${o.name}</td><td>${o.item}</td><td>${fmt(o.price)}</td>
  <td><span class="tag">${o.status}</span></td><td>${o.note||''}</td>
  <td><button onclick="editOrder(${o.id})">Sửa</button> <button class="secondary" onclick="delOrder(${o.id})">Xóa</button></td></tr>`).join('')||'<tr><td colspan="6">Không có đơn nào khớp.</td></tr>';
}
function saveOrder(e){e.preventDefault();
 const o={name:document.getElementById('fName').value.trim(),item:document.getElementById('fItem').value.trim(),price:Number(document.getElementById('fPrice').value),status:document.getElementById('fStatus').value,note:document.getElementById('fNote').value.trim()};
 if(editId){Object.assign(orders.find(x=>x.id===editId),o);editId=null;document.getElementById('formTitle').textContent='Thêm đơn mới';document.getElementById('editNote').textContent='';}
 else{orders.unshift({id:Date.now(),...o});}
 e.target.reset();persist();render();
}
function editOrder(id){const o=orders.find(x=>x.id===id);editId=id;
 document.getElementById('fName').value=o.name;document.getElementById('fItem').value=o.item;document.getElementById('fPrice').value=o.price;document.getElementById('fStatus').value=o.status;document.getElementById('fNote').value=o.note||'';
 document.getElementById('formTitle').textContent='Đang sửa đơn của '+o.name;document.getElementById('editNote').textContent='Nhấn Lưu đơn để cập nhật.';
 window.scrollTo({top:0,behavior:'smooth'});}
function delOrder(id){if(confirm('Xóa đơn này?')){orders=orders.filter(x=>x.id!==id);persist();render();}}
function resetData(){if(confirm('Khôi phục lại 31 đơn gốc? Các thay đổi sẽ mất.')){localStorage.removeItem(KEY);location.reload();}}
function exportCSV(){const rows=[['Khach','Mon hang','Gia (k)','Trang thai','Ghi chu'],...orders.map(o=>[o.name,o.item,o.price,o.status,o.note||''])];
 const csv=rows.map(r=>r.map(c=>'"'+String(c).replaceAll('"','""')+'"').join(',')).join('\n');
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+csv],{type:'text/csv'}));a.download='don-hang.csv';a.click();}
render();
</script>
</body>
</html>
